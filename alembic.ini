# =============================================================================
#  Alembic configuration (§9, §141)
# =============================================================================
#  Every schema change requires a migration. Tables are never altered by hand in
#  any environment, including development: a hand-made change is a change that
#  does not exist on the VPS.
#
#  The connection URL is NOT set here. env.py resolves it from arb_core.config
#  (DATABASE_MIGRATION_URL), so credentials live in the environment / secret
#  manager and never in a committed file (§90, §133).
#
#  Usage:
#     make migration m="add orders table"   # autogenerate a new revision
#     make migrate                          # upgrade head
#     make migrate-down                     # downgrade one revision
#     alembic history --verbose
# =============================================================================
[alembic]
script_location = packages/persistence/alembic

# Migration files are named <revision>_<slug>.py and are ordered by the
# down_revision chain, not by filename.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

# Importable module path for env.py when invoked from the repository root.
prepend_sys_path = .
# How `prepend_sys_path` (and `version_locations`) are split into separate
# entries. Required since Alembic 1.16: without it Alembic emits a
# DeprecationWarning and falls back to splitting on spaces, commas AND colons —
# which breaks any path containing a colon, and fails outright under a
# `-W error` test/CI configuration. `os` means os.pathsep (`:` on POSIX,
# `;` on Windows).
path_separator = os

version_path_separator = os
output_encoding = utf-8

# Intentionally empty — env.py raises if it cannot resolve a URL from settings,
# rather than silently migrating the wrong database.
sqlalchemy.url =

# -----------------------------------------------------------------------------
# Logging is configured by env.py through arb_core.log so migration output is
# structured JSON in CI and readable locally, and so secrets are redacted. The
# standard [loggers]/[handlers]/[formatters] sections are therefore omitted and
# env.py does not call logging.config.fileConfig().
# -----------------------------------------------------------------------------
