# =============================================================================
#  nginx — the platform's only public listener (§87, §88, §124)
# =============================================================================
#  Responsibilities, and deliberately NOT responsibilities:
#
#    * Terminate HTTP(S) and proxy to the API service.
#    * Hide the server software and refuse paths nobody should reach.
#    * Apply a coarse rate limit as a first line of defence.
#
#  Security headers are NOT set here. The application already sends the full
#  platform set on every response, including errors
#  (arb_api.middleware.security_headers and arb_api.middleware.error_handlers).
#  `add_header` here would produce a *second* Content-Security-Policy on each
#  response, and a browser enforces the intersection of duplicated headers —
#  which turns a working policy into a mysteriously broken one. The single
#  exception is HSTS, configured in conf.d/tls.conf.example, because it is a
#  property of the TLS listener rather than of a response body.
# =============================================================================

user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # §124 — never advertise the nginx version. A precise version is a free
    # CVE lookup for anyone scanning the port. `server_tokens off` reduces the
    # header to the bare product name; removing it entirely needs the
    # headers-more module, which stock nginx:alpine does not ship, and a
    # directive the image cannot parse is a container that will not start.
    server_tokens off;

    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"forwarded_for":"$http_x_forwarded_for",'
            '"request_id":"$http_x_request_id",'
            '"method":"$request_method",'
            '"path":"$request_uri",'
            '"status":$status,'
            '"body_bytes":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_time":"$upstream_response_time",'
            '"upstream_status":"$upstream_status",'
            '"referer":"$http_referer",'
            '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # A JSON API has no legitimate multi-megabyte request. Bounding this is what
    # stops a single client from exhausting worker memory (§88).
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Coarse, unauthenticated-request rate limiting. The application enforces
    # per-user and per-endpoint limits (§76); this protects the process from
    # being reached at all by a flood. 10r/s with a small burst is far above any
    # legitimate dashboard polling rate and far below a scan.
    limit_req_zone $binary_remote_addr zone=public:10m rate=10r/s;
    limit_req_status 429;

    # WebSocket upgrade map. Unused in Phase 1; market data (Phase 4) streams
    # over a socket, and adding the map now means no nginx change is needed when
    # the endpoint appears.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # The API service. `resolver` is unnecessary because compose provides a DNS
    # name that resolves at startup; an upstream block keeps the connection pool
    # alive instead of opening a socket per request.
    upstream arbitrage_api {
        server api:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
