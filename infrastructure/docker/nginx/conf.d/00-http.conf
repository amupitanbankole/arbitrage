# =============================================================================
#  HTTP listener — proxies to the API (§87)
# =============================================================================
#  Loaded as conf.d/00-http.conf so that tls.conf (10-) is parsed after it and
#  its `return 301` cannot be shadowed.
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # nginx's own liveness, answered without touching the application. The
    # compose healthcheck uses it, so a hung API does not also take down the
    # proxy's health signal.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # §124 — metrics are scraped by Prometheus over the internal network.
    # Returning 404 rather than 403 avoids confirming the endpoint exists to a
    # caller who should never have found it. `deny all` would produce 403.
    location = /metrics {
        return 404;
    }

    # Interactive API documentation is a development affordance. Exposing it
    # publicly publishes the complete route surface and every schema, which is
    # reconnaissance handed over for free (§124). Serve it locally
    # (http://127.0.0.1:8000/docs) or put it behind authentication in a later
    # phase.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    # Refuse dotfiles and VCS directories outright. No route the application
    # serves begins with a dot, so this can only ever be a probe.
    location ~ /\. {
        return 404;
    }

    location / {
        limit_req zone=public burst=20 nodelay;

        proxy_pass http://arbitrage_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # The application reads these to derive the client address and scheme.
        # Without X-Forwarded-Proto a TLS request would look like plain HTTP and
        # the API would emit insecure cookies (§61).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket upgrade (market data, Phase 4). Harmless for plain requests
        # because $connection_upgrade resolves to "close" without an Upgrade
        # header.
        proxy_set_header Upgrade $http_upgrade;

        # Correlation: the API generates its own request id, but forwarding a
        # client-supplied one lets a browser report and an nginx access log line
        # be joined (§66).
        proxy_set_header X-Request-ID $http_x_request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Never buffer a streaming response into a temp file on disk.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # A custom error page is deliberately NOT configured: the application
    # returns a JSON envelope for every failure it produces, and nginx's own
    # HTML error pages would only appear when the API is unreachable — where an
    # empty 502 says less than the plain status.
}
