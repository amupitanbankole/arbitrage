[project]
name = "arb-worker"
version = "0.1.0"
description = "Background worker runtime: role-based processes with heartbeat and graceful shutdown"
requires-python = ">=3.11"
dependencies = [
    "arb-core",
]

[project.scripts]
arb-worker = "arb_worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arb_worker"]

[tool.uv.sources]
arb-core = { workspace = true }

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
mypy_path = "src:../../packages/core/src"
