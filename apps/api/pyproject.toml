[project]
name = "arb-api"
version = "0.1.0"
description = "FastAPI application: versioned REST API, health, metrics, middleware"
requires-python = ">=3.11"
dependencies = [
    "arb-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "python-multipart>=0.0.9",
]

[project.scripts]
arb-api = "arb_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arb_api"]

[tool.uv.sources]
arb-core = { workspace = true }

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
mypy_path = "src:../../packages/core/src"
